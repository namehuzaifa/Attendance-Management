<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Offline · HRMS</title>
    <style>
        :root {
            --bg: #f4f3fb;
            --card: #ffffff;
            --text: #1e1a3c;
            --muted: #6b6889;
            --violet: #7367f0;
            --stroke: rgba(34, 28, 71, .1);
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0e0b1f;
                --card: #16122e;
                --text: #f3f1ff;
                --muted: #a39fc4;
                --stroke: rgba(255, 255, 255, .1);
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .card {
            width: 100%;
            max-width: 380px;
            text-align: center;
            background: var(--card);
            border: 1px solid var(--stroke);
            border-radius: 20px;
            padding: 34px 26px;
            box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .45);
        }

        img { width: 68px; height: 68px; }

        h1 { font-size: 1.25rem; margin: 18px 0 8px; }

        p { color: var(--muted); font-size: .92rem; line-height: 1.5; margin: 0 0 20px; }

        button {
            font: inherit;
            font-weight: 600;
            border: none;
            cursor: pointer;
            width: 100%;
            padding: 13px 18px;
            border-radius: 13px;
            color: #fff;
            background: var(--violet);
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/assets/images/hrms-logo.svg" alt="HRMS">

        <h1>You're offline</h1>

        <p>
            HRMS needs a connection to record attendance, so nothing is saved
            while you are offline. Reconnect and try again.
        </p>

        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
