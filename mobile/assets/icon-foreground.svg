<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Scaled to 0.92 so the whole mark stays inside an adaptive icon's
       safe zone when a launcher masks it to a circle or a squircle. -->
